server:
  port: ${PORT:8083}
  forward-headers-strategy: framework

spring:
  application:
    name: shishi-site
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shishi_site}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  # 上传文件存放目录(生产用绝对路径,如 /opt/shishi-site/data/uploads)
  upload-dir: ${UPLOAD_DIR:data/uploads}
  # 初始管理员
  init-admin-username: ${ADMIN_INIT_USERNAME:admin}
  init-admin-password: ${ADMIN_INIT_PASSWORD:Shishi@2026}
  # 站点信息
  site-name: ${SITE_NAME:成都市石室联中132学校}
  site-en: ${SITE_EN:Chengdu Shishi Union No.132 School}
  beian: ${SITE_BEIAN:}
